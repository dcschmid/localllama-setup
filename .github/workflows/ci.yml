name: ci
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shell syntax
        run: |
          for f in setup.sh uninstall.sh libexec/* benchmarks/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning setup.sh uninstall.sh libexec/pi-sandbox libexec/llama-webui
      - name: json configs
        run: |
          for f in config/ui.json config/pi.json.in config/llama-cpp.config.toml; do :; done
          python3 - <<'PY'
          import json,pathlib
          json.loads(pathlib.Path('config/ui.json').read_text())
          json.loads(pathlib.Path('config/pi.json.in').read_text().replace('@HOME@','/h','/h'))
          PY
      - name: model manifest
        run: |
          awk -F'\t' 'NR>1 && NF!=12 {print "bad row:",FILENAME,NR; exit 1}' packages/models.tsv
          awk -F'\t' 'NR>1 && $5 !~ /^[0-9a-f]{64}$/ {print "bad sha:",$1; exit 1}' packages/models.tsv
          awk -F'\t' 'NR>1 && $4 !~ /^[0-9]+$/ {print "bad size:",$1; exit 1}' packages/models.tsv
      - name: doc links
        run: python3 .github/links.py
      - name: bash unit tests (platform independent)
        run: bash tests/unit.sh
  integration-fedora:
    runs-on: ubuntu-latest
    if: false   # needs Fedora user session + services; run locally: ./setup.sh doctor
    steps: []
  cuda:
    runs-on: ubuntu-latest
    if: false   # needs RTX 5070; measurements come from local ./setup.sh benchmark
    steps: []
